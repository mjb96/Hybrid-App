name: Release (AAB + APK)

# Builds a SIGNED Android App Bundle (.aab) + APK for Play upload.
#
# Runs automatically on every merge to main (versionName is auto-derived as
# 1.0.<commit-count>), and can also be run manually with an explicit versionName
# for a real Play release.
#
# [You] add these repository secrets first (Settings → Secrets → Actions):
#   KEYSTORE_BASE64     - your upload keystore, base64-encoded
#                         (base64 -w0 my-release.keystore | pbcopy)
#   KEYSTORE_PASSWORD   - keystore password
#   KEY_ALIAS           - key alias
#   KEY_PASSWORD        - key password
# The signed AAB is uploaded as a build artifact to download and push to Play.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.0.0) — blank auto-derives 1.0.<commitCount>'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so VERSION_CODE = commit count is stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Copy PWA into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rsync -av \
            --exclude='.git' \
            --exclude='android' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='scripts' \
            --exclude='.github' \
            --exclude='package*.json' \
            . android/app/src/main/assets/www/

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — add the signing secrets before building a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/helyx-release.keystore"

      - name: Build signed release bundle + APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_PATH: ${{ runner.temp }}/helyx-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
        run: |
          export VERSION_CODE=$(git rev-list --count HEAD)
          # Manual dispatch can pin a versionName; an automatic merge-to-main
          # build derives 1.0.<commitCount> so it always increments.
          export VERSION_NAME="${INPUT_VERSION_NAME:-1.0.$VERSION_CODE}"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          # bundleRelease → .aab for Play; assembleRelease → signed .apk for sideload testing.
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload AAB artifact (Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: helyx-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact (sideload / device test)
        uses: actions/upload-artifact@v4
        with:
          name: helyx-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
