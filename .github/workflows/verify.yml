name: Required verification

on:
  workflow_call:
  pull_request:
  push:
    branches: ['codex/**', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax-check every JavaScript module
        run: |
          find js scripts sw.js -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Install required Chromium
        run: npx playwright install --with-deps chromium

      - name: Type, precache, workflow, unit, and smoke verification
        run: npm run verify

      - name: Required real-browser checks
        run: npm run browser:verify

  android:
    name: Android verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install Android SDK platform 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" --sdk_root=$ANDROID_HOME

      - name: Install locked web dependencies
        run: npm ci

      - name: Stage production web assets
        run: node scripts/stage-web-root.mjs android/app/src/main/assets/www

      - name: Test, lint, and assemble debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
